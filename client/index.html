<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Santé | Connexion</title>
  <meta name="theme-color" content="#0b3a6e">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">

    <!-- Colonne image (photo : client/img/agent.png) -->
    <section class="visuel" aria-hidden="true"></section>

    <!-- Colonne connexion -->
    <main class="panneau">
      <div class="contenu">

        <svg class="logo" viewBox="0 0 140 90" role="img" aria-label="Logo E-Santé">
          <circle cx="70" cy="12" r="8" fill="#1e6fd9"/>
          <path d="M56 36c0-9 6-15 14-15s14 6 14 15z" fill="#1e6fd9"/>
          <circle cx="40" cy="22" r="7" fill="#7b5cf0"/>
          <path d="M27 44c0-8 5-13 13-13s13 5 13 13z" fill="#7b5cf0"/>
          <circle cx="100" cy="22" r="7" fill="#f08a24"/>
          <path d="M87 44c0-8 5-13 13-13s13 5 13 13z" fill="#f08a24"/>
          <rect x="52" y="64" width="8" height="14" rx="1.5" fill="#1e6fd9"/>
          <rect x="64" y="58" width="8" height="20" rx="1.5" fill="#1e6fd9"/>
          <rect x="76" y="52" width="8" height="26" rx="1.5" fill="#1e6fd9"/>
          <rect x="88" y="46" width="8" height="32" rx="1.5" fill="#1e6fd9"/>
          <path d="M14 70c30 22 82 22 112-12" fill="none" stroke="#7b5cf0" stroke-width="6" stroke-linecap="round"/>
        </svg>

        <h1 class="marque">E-Santé</h1>
        <p class="accroche">Ensemble pour des données communautaires fiables</p>

        <div class="badge-district">District sanitaire de Léo</div>
        <p class="slogan">Collecter · Gérer · Analyser · Partager</p>

        <button id="btn-connexion" class="btn-principal" type="button">
          Se connecter <span aria-hidden="true">→</span>
        </button>

        <form id="form-connexion" class="formulaire" hidden>
          <label for="identifiant">Identifiant</label>
          <input id="identifiant" type="text" autocomplete="username" required>

          <label for="motdepasse">Mot de passe</label>
          <input id="motdepasse" type="password" autocomplete="current-password" required>

          <p id="erreur" class="erreur" hidden></p>
          <button class="btn-principal" type="submit">Valider <span aria-hidden="true">→</span></button>
        </form>

        <ul class="atouts">
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
            <span>Suivi des activités</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
            <span>Analyse des données</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8"/></svg>
            <span>Rapports rapides</span>
          </li>
        </ul>
      </div>

      <svg class="vague" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 95C160 50 330 130 600 60V120H0Z" fill="#4f6bed"/>
        <path d="M0 70C120 20 260 110 600 30V120H0Z" fill="#7b5cf0" opacity=".92"/>
      </svg>
    </main>

  </div>

  <script src="/js/login.js"></script>
</body>
</html>
